name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowcart
          POSTGRES_PASSWORD: flowcart_test_secret
          POSTGRES_DB: flowcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: postgres://flowcart:flowcart_test_secret@localhost:5432/flowcart
          REDIS_URL: redis://localhost:6379
          APP_ENCRYPTION_KEY: dGhpc2lzYTMyYnl0ZXNlY3JldGtleWZvcmZsb3djYXJ0IQ==
          CSRF_SECRET: Y3NyZnNlY3JldGtleWZvcmZsb3djYXJ0MTIzNDU2Nzg5MDE=
