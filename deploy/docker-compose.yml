services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-flowcart.example.com}
    depends_on:
      - web
      - api
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_URL: http://api:4000
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flowcart}:${POSTGRES_PASSWORD:-flowcart}@postgres:5432/${POSTGRES_DB:-flowcart}
      REDIS_URL: redis://:${REDIS_PASSWORD:-flowcart}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flowcart}:${POSTGRES_PASSWORD:-flowcart}@postgres:5432/${POSTGRES_DB:-flowcart}
      REDIS_URL: redis://:${REDIS_PASSWORD:-flowcart}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowcart}
      POSTGRES_DB: ${POSTGRES_DB:-flowcart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-flowcart}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ../.env
    command: redis-server --requirepass ${REDIS_PASSWORD:-flowcart} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  app:
    driver: bridge
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
